# ===== Server =====
server.port=8080

# ===== Supabase / PostgreSQL =====
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===== Email (Brevo API) =====
brevo.api.key=${BREVO_API_KEY}
brevo.sender.email=${BREVO_SENDER_EMAIL}
brevo.sender.name=CRIMENEXA Security

# ===== JWT =====
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000

# ===== File Upload =====
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# ===== AI Service =====
# NOTE: this value INCLUDES the /api prefix. Callers append the route only
# (e.g. "/graph/{id}", "/ingestion/cdr") - never a second "/api".
ai.service.base-url=${AI_SERVICE_BASE_URL:http://localhost:8000/api}

# ===== Supabase Storage =====
# Evidence files live here rather than on the container filesystem, which is
# ephemeral - a restart otherwise loses the file while its DB row survives.
supabase.url=${SUPABASE_URL}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:evidence-files}

# ===== Internal Service-to-Service Auth =====
# Shared secret for /api/internal/**, which the AI service calls to push
# alerts. That path is exempt from session auth, so this key is the only thing
# guarding it - it must be set, and must match INTERNAL_API_KEY on the AI service.
internal.api.key=${INTERNAL_API_KEY}

# ===== CORS =====
# Allowed origins are hardcoded in CorsConfig, so there is no property here.
# Adding a deployed frontend's origin therefore needs a code change and a
# redeploy - it cannot be done from the Render dashboard. An origin that is
# missing gets a bare 403 with no hint that CORS was the cause.